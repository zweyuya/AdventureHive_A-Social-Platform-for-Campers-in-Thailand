{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdventureHive Clickable Prototype</title>
<meta name="description" content="Clickable prototype of three AdventureHive tasks used in the PS3 user feedback sessions.">
<link rel="icon" href="{% static 'ps4/logo-mark.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a slim prototype bar over a full-width app screenshot; task cards before and after each run. */
:root {
  --bg: #f4f8f6; --surface: #ffffff; --ink: #1d2b36; --muted: #5b6b78; --line: #dfe8e3;
  --forest: #0f6647; --forest-soft: #e3f1ea; --sunrise: #f58a1f; --sunrise-soft: #fff1e0; --navy: #142659;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a17; --surface: #16231f; --ink: #e6efea; --muted: #9db0a7; --line: #273833;
  --forest: #4cc493; --forest-soft: #193b2f; --sunrise: #f8a352; --sunrise-soft: #3a2a16; --navy: #c9d4f5; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1a17; --surface: #16231f; --ink: #e6efea; --muted: #9db0a7; --line: #273833;
  --forest: #4cc493; --forest-soft: #193b2f; --sunrise: #f8a352; --sunrise-soft: #3a2a16; --navy: #c9d4f5; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [role=button]:focus-visible { outline: 3px solid var(--sunrise); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--forest);
  background: var(--forest-soft); padding: 3px 10px; border-radius: 999px; }
.bar .where { color: var(--muted); font-size: 13px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--forest); color: var(--forest); }
.btn.primary { background: var(--forest); border-color: var(--forest); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.wrap { padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
.lead { color: var(--muted); margin: 0; max-width: 62ch; }
.tasks { display: grid; gap: 12px; }
.task { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; }
.task:hover { border-color: var(--forest); }
.task .who { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.task strong { font-size: 16px; }
.task span.desc { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
.taskcard { background: var(--sunrise-soft); border-left: 4px solid var(--sunrise); border-radius: 0 10px 10px 0; padding: 14px 16px; font-size: 17px; font-weight: 500; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.stage { max-width: 1280px; margin: 0 auto; position: relative; }
.stage img { display: block; width: 100%; height: auto; border-radius: 0 0 6px 6px; user-select: none; -webkit-user-drag: none; }
.hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 6px; }
.show-hot .hot { outline: 2px dashed var(--sunrise); background: rgba(245,138,31,.12); }
.log { max-width: 760px; margin: 0 auto; }
.log ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; font-size: 14px; }
.log .miss { color: var(--sunrise); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stats div { display: grid; }
.stats b { font-size: 22px; }
.stats span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: min(560px, calc(100vw - 32px)); width: 100%; padding: 22px; }
dialog::backdrop { background: rgba(10, 20, 16, .45); }
@media (max-width: 560px) { .bar .where { flex-basis: 100%; order: 3; } }
@media (prefers-reduced-motion: no-preference) { .stage img { animation: fade .18s ease-out; } }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }
</style>
<style>body{margin:0} a.btn{text-decoration:none}</style>
</head>
<body>


<div class="bar">
  <span class="tag">Prototype</span>
  <span class="where" id="where">AdventureHive · clickable screens</span>
  <a class="btn" href="{% url 'ps4:index' %}">PS4 pages</a>
  <button class="btn" id="btnTask" hidden>Show task</button>
  <button class="btn" id="btnEnd" hidden>End task</button>
  <button class="btn" id="btnHome" hidden>All tasks</button>
  <button class="btn" id="btnLog">Facilitator</button>
</div>

<main class="wrap" id="view"></main>

<dialog id="taskDlg">
  <div style="display:grid;gap:14px">
    <strong>Your task</strong>
    <div class="taskcard" id="taskDlgText"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="taskDlgClose">Back to the screen</button></div>
  </div>
</dialog>

<dialog id="logDlg">
  <div style="display:grid;gap:14px">
    <strong>Facilitator tools</strong>
    <p class="note">Only for the interviewer. Participants should not open this.</p>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="showHot"> Show clickable areas on the screen</label>
    <div id="logBody" class="log"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="copyLog">Copy click log</button>
      <button class="btn" id="restart">Back to task list</button>
      <button class="btn primary" id="logClose">Close</button>
    </div>
  </div>
</dialog>

<script>
const BASE = "{% static 'ps4/prototype/' %}";
const SCREENS = {"a1":{"title":"Trips list","w":1280,"h":800,"hotspots":[{"to":"a2","label":"Pha Taem Sunrise Weekend card","x":25.703,"y":50.125,"w":23.906,"h":30.75},{"to":"a2k","label":"Khao Yai Weekend Camp card (already joined)","x":1.016,"y":50.125,"w":23.906,"h":30.75}]},"a2k":{"title":"Khao Yai trip (already joined)","w":1280,"h":1503,"hotspots":[{"to":"a1","label":"Back to trips","x":0,"y":5.655,"w":10.978,"h":2.661}]},"a2":{"title":"Trip page before joining","w":1280,"h":1203,"hotspots":[{"to":"a1","label":"Back to trips","x":0,"y":7.066,"w":10.978,"h":3.325},{"to":"a3","label":"Campsite name","x":52.266,"y":27.889,"w":12.964,"h":2.078},{"to":"a4","label":"Join this trip","x":73.516,"y":38.279,"w":23.906,"h":4.323}]},"a3":{"title":"Campsite page with reviews","w":1280,"h":1306,"hotspots":[{"to":"a2","label":"View (upcoming trip)","x":92.823,"y":15.85,"w":4.911,"h":2.91},{"to":"a3r","label":"Reviews tab","x":15.83,"y":33.155,"w":9.316,"h":3.828}]},"a3r":{"title":"Campsite reviews tab","w":1280,"h":1306,"hotspots":[{"to":"a2","label":"View (upcoming trip)","x":92.823,"y":15.85,"w":4.911,"h":2.91},{"to":"a3","label":"Overview tab","x":0.938,"y":33.155,"w":8.163,"h":3.828}]},"a4":{"title":"Joined: confirmed","w":1280,"h":1545,"hotspots":[{"to":"done","label":"Back to trips (finish)","x":0,"y":5.502,"w":10.978,"h":2.589}]},"b1":{"title":"Trips list","w":1280,"h":800,"hotspots":[{"to":"b2","label":"Doi Inthanon card","x":75.078,"y":50.125,"w":23.906,"h":30.75},{"to":"b4","label":"Pha Taem card","x":25.703,"y":50.125,"w":23.906,"h":30.75},{"to":"b2k","label":"Khao Yai card","x":1.016,"y":50.125,"w":23.906,"h":30.75}]},"b2k":{"title":"Khao Yai trip page","w":1280,"h":1503,"hotspots":[{"to":"b1","label":"Back to trips","x":0,"y":5.655,"w":10.978,"h":2.661}]},"b2":{"title":"Doi Inthanon trip (intermediate)","w":1280,"h":1061,"hotspots":[{"to":"b1","label":"Back to trips","x":0,"y":8.011,"w":10.978,"h":3.77},{"to":"b3","label":"Join this trip","x":73.516,"y":43.261,"w":23.906,"h":4.901}]},"b3":{"title":"Cannot join: needs intermediate","w":1280,"h":1061,"hotspots":[{"to":"b1","label":"Back to trips","x":0,"y":8.011,"w":10.978,"h":3.77}]},"b4":{"title":"Pha Taem trip (beginner)","w":1280,"h":1203,"hotspots":[{"to":"b1","label":"Back to trips","x":0,"y":7.066,"w":10.978,"h":3.325},{"to":"b5","label":"Join this trip","x":73.516,"y":38.279,"w":23.906,"h":4.323}]},"b5":{"title":"Joined: confirmed","w":1280,"h":1545,"hotspots":[{"to":"done","label":"Back to trips (finish)","x":0,"y":5.502,"w":10.978,"h":2.589}]},"c1":{"title":"Trips organised","w":1280,"h":842,"hotspots":[{"to":"c2","label":"Open (just-finished trip)","x":17.266,"y":38.717,"w":5.09,"h":4.513}]},"c2":{"title":"Attendance: before","w":1280,"h":1631,"hotspots":[{"to":"c1","label":"Back to trips","x":0,"y":5.212,"w":10.978,"h":2.452},{"to":"c3","label":"June: Attended","x":83.73,"y":76.732,"w":6.661,"h":2.33}]},"c3":{"title":"Attendance: reason box appears","w":1280,"h":1681,"hotspots":[{"to":"c3b","label":"Reason box (types the reason)","x":73.516,"y":77.96,"w":23.906,"h":2.974},{"to":"c3err","label":"Save attendance (no reason yet)","x":73.516,"y":81.648,"w":23.906,"h":2.855}]},"c4":{"title":"Attendance saved","w":1280,"h":1681,"hotspots":[{"to":"done","label":"Back to trips (finish)","x":0,"y":5.057,"w":10.978,"h":2.38}]},"c3err":{"title":"Attendance: reason missing","w":1280,"h":1751,"hotspots":[{"to":"c3b","label":"Reason box (types the reason)","x":73.516,"y":74.843,"w":23.906,"h":2.856},{"to":"c3err","label":"Save attendance (no reason yet)","x":73.516,"y":82.381,"w":23.906,"h":2.741}]},"c3b":{"title":"Attendance: reason typed","w":1280,"h":1681,"hotspots":[{"to":"c4","label":"Save attendance","x":73.516,"y":81.648,"w":23.906,"h":2.855}]}};
const TASKS = {
  a: { who: "Regular camper", title: "Find, judge and join a trip", start: "a1",
       text: "It's Wednesday and your friends just cancelled your weekend plan. Using AdventureHive, find a camping trip you could join soon, decide whether you trust the reviews of its campsite, and join the trip.",
       desc: "Trips list, trip page, campsite reviews, join. Logged in as a demo camper." },
  b: { who: "First-time camper", title: "Find a trip that suits a beginner", start: "b1",
       text: "You have never been camping before. Find a trip that suits a beginner, check what you need to bring, and join it.",
       desc: "Includes a trip that needs intermediate experience, to see how the refusal reads." },
  c: { who: "Trip organizer", title: "Record who attended", start: "c1",
       text: "You organised the Khao Yai trip that just ended. Record who attended. June came, but she couldn't check in because her phone battery died.",
       desc: "Trips organised, attendance list, the reason box and Save." },
};
const view = document.getElementById("view"), where = document.getElementById("where");
const btnTask = document.getElementById("btnTask");
let run = null; // { task, screen, started, events: [] }

const fmt = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function log(kind, text) { if (run) run.events.push({ t: Date.now() - run.started, kind, screen: SCREENS[run.screen]?.title || run.screen, text }); }

function home() {
  run = null; btnTask.hidden = true; btnEnd.hidden = true; btnHome.hidden = true; where.textContent = "AdventureHive · clickable screens";
  view.innerHTML = `<div class="panel">
    <h1>AdventureHive clickable prototype</h1>
    <p class="lead">Screens from the AdventureHive web app with the task path made clickable. Nothing you do here changes real data. Choose the task for this session.</p>
    <div class="tasks">${Object.entries(TASKS).map(([k, t]) => `
      <button class="task" data-task="${k}"><span class="who">${t.who}</span><strong>${t.title}</strong><span class="desc">${t.desc}</span></button>`).join("")}
    </div>
    <p class="note">Screens show demo accounts with made-up people. Maps are not included.</p>
  </div>`;
  view.querySelectorAll("[data-task]").forEach(b => b.onclick = () => brief(b.dataset.task));
  window.scrollTo(0, 0);
}

function brief(k) {
  const t = TASKS[k]; btnTask.hidden = true; btnEnd.hidden = true; btnHome.hidden = false; where.textContent = t.title;
  view.innerHTML = `<div class="panel"><div class="card">
    <span class="tag" style="justify-self:start">${t.who}</span>
    <h1>Your task</h1>
    <div class="taskcard">${t.text}</div>
    <p class="note">Please think aloud as you go: say what you're looking for and what you expect to happen. Not everything on the screens is clickable. If something does nothing, say what you expected.</p>
    <div class="row"><button class="btn primary" id="go">Start</button><button class="btn" id="back">Choose another task</button></div>
  </div></div>`;
  document.getElementById("go").onclick = () => { run = { task: k, screen: null, started: Date.now(), events: [] }; show(t.start); };
  document.getElementById("back").onclick = home;
  window.scrollTo(0, 0);
}

function show(id) {
  if (id === "done") return finish();
  const s = SCREENS[id]; run.screen = id; btnTask.hidden = false; btnEnd.hidden = false; btnHome.hidden = false;
  where.textContent = TASKS[run.task].title + " · " + s.title;
  view.innerHTML = `<div class="stage" id="stage">
    <img src="${BASE}${id}.jpg" alt="AdventureHive screen: ${s.title}" width="${s.w}" height="${s.h}" draggable="false">
    ${s.hotspots.map((h, i) => `<button class="hot" data-i="${i}" aria-label="${h.label}"
        style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"></button>`).join("")}
  </div>`;
  const stage = document.getElementById("stage");
  stage.classList.toggle("show-hot", document.getElementById("showHot").checked);
  stage.addEventListener("click", e => {
    const hot = e.target.closest(".hot");
    if (hot) { const h = s.hotspots[hot.dataset.i]; log("hit", h.label); show(h.to); return; }
    const r = stage.getBoundingClientRect();
    log("miss", `Clicked somewhere with no action (${Math.round((e.clientX - r.left) / r.width * 100)}% across, ${Math.round((e.clientY - r.top) / r.height * 100)}% down)`);
  });
  window.scrollTo(0, 0);
}

function finish(early = false) {
  if (early) log("end", "Task ended before reaching the last screen");
  const misses = run.events.filter(e => e.kind === "miss").length, hits = run.events.filter(e => e.kind === "hit").length;
  run.finished = Date.now(); btnTask.hidden = true; btnEnd.hidden = true; btnHome.hidden = false;
  where.textContent = TASKS[run.task].title + (early ? " · ended" : " · finished");
  view.innerHTML = `<div class="panel"><div class="card">
    <span class="tag" style="justify-self:start">${early ? "Task ended" : "Task finished"}</span>
    <h1>Thank you!</h1>
    <p class="lead">That's the end of the task. The interviewer will ask you a few questions now.</p>
    <div class="stats"><div><b>${fmt(run.finished - run.started)}</b><span>Time</span></div>
      <div><b>${hits}</b><span>Steps</span></div><div><b>${misses}</b><span>Clicks with no action</span></div></div>
    <div class="row"><button class="btn" id="seeLog">Facilitator: see click log</button><button class="btn primary" id="again">Back to task list</button></div>
  </div></div>`;
  document.getElementById("seeLog").onclick = openLog;
  document.getElementById("again").onclick = home;
  window.scrollTo(0, 0);
}

function logText() {
  if (!run || !run.events.length) return "";
  return TASKS[run.task].title + "\n" + run.events.map(e => `${fmt(e.t)}  [${e.screen}]  ${e.kind === "hit" ? "Clicked: " + e.text : e.text}`).join("\n");
}
function openLog() {
  const body = document.getElementById("logBody");
  body.innerHTML = !run || !run.events.length ? '<p class="note">No clicks recorded yet in this session.</p>' :
    `<ol>${run.events.map(e => `<li class="${e.kind}"><b>${fmt(e.t)}</b> · ${e.screen} · ${e.kind === "hit" ? "Clicked " + e.text : e.text}</li>`).join("")}</ol>`;
  document.getElementById("logDlg").showModal();
}
document.getElementById("btnLog").onclick = openLog;
document.getElementById("logClose").onclick = () => document.getElementById("logDlg").close();
document.getElementById("restart").onclick = () => { document.getElementById("logDlg").close(); home(); };
document.getElementById("showHot").onchange = e => document.getElementById("stage")?.classList.toggle("show-hot", e.target.checked);
document.getElementById("copyLog").onclick = async e => {
  const text = logText() || "No clicks recorded yet.";
  try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied"; }
  catch { const pre = document.createElement("textarea"); pre.value = text; pre.style.width = "100%"; pre.rows = 8;
          document.getElementById("logBody").append(pre); pre.select(); e.target.textContent = "Select and copy the text below"; }
  setTimeout(() => e.target.textContent = "Copy click log", 2500);
};
const btnEnd = document.getElementById("btnEnd"), btnHome = document.getElementById("btnHome");
btnEnd.onclick = () => { if (run && !run.finished) finish(true); };
btnHome.onclick = () => { if (run && !run.finished && run.screen) log("end", "Left the task for the task list"); home(); };
btnTask.onclick = () => { document.getElementById("taskDlgText").textContent = TASKS[run.task].text; document.getElementById("taskDlg").showModal(); };
document.getElementById("taskDlgClose").onclick = () => document.getElementById("taskDlg").close();
home();
</script>

</body>
</html>
