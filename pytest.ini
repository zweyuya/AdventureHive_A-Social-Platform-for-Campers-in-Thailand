[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # Harmless Django 5.2 notice about URL fields in admin forms (changes in Django 6.0)
    ignore:The default scheme will be changed:django.utils.deprecation.RemovedInDjango60Warning
